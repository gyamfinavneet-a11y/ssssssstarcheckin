<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>签到</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--gold:#FFD700;--gold-dark:#FFA500;--bg-dark:#0d0d1a;--bg-card:rgba(255,255,255,0.06);--border:rgba(255,255,255,0.1);--text-dim:#888;--text:#eee}
body{background:var(--bg-dark);background-image:radial-gradient(ellipse at top,rgba(255,215,0,0.08) 0%,transparent 50%),radial-gradient(ellipse at bottom,rgba(255,165,0,0.05) 0%,transparent 50%);min-height:100vh;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);display:flex;flex-direction:column;align-items:center;padding:0 16px}
.header{text-align:center;padding:28px 0 24px;width:100%;max-width:420px}
.star-icon{width:56px;height:56px;margin:0 auto 16px;background:linear-gradient(135deg,var(--gold),var(--gold-dark));clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);box-shadow:0 0 30px rgba(255,215,0,0.4);animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.header h1{font-size:26px;font-weight:700;background:linear-gradient(90deg,var(--gold),var(--gold-dark));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
.header p{font-size:14px;color:var(--text-dim)}
.search-wrap{width:100%;max-width:420px;margin-bottom:16px;position:relative}
.search-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;opacity:0.4}
.search-input{width:100%;background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:14px 14px 14px 44px;font-size:16px;color:var(--text);outline:none;-webkit-appearance:none}
.search-input:focus{border-color:rgba(255,215,0,0.4)}
.search-input::placeholder{color:#555}
.stats-bar{width:100%;max-width:420px;display:flex;justify-content:space-between;margin-bottom:12px;font-size:13px;color:var(--text-dim)}
.stats-bar .count{color:var(--gold);font-weight:700}
.member-list{width:100%;max-width:420px;display:flex;flex-direction:column;gap:8px;padding-bottom:40px}
.member-card{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:14px;transition:all 0.25s}
.member-card.checked{opacity:0.45;border-color:rgba(255,215,0,0.2)}
.avatar-circle{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:#fff;flex-shrink:0;position:relative}
.member-card.checked .avatar-circle::after{content:'';position:absolute;bottom:-2px;right:-2px;width:18px;height:18px;background:var(--gold);clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);border:2px solid var(--bg-dark)}
.member-info{flex:1;min-width:0}
.member-info .name{font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.member-card.checked .name{color:var(--gold)}
.member-info .status{font-size:12px;color:#555;margin-top:2px}
.member-card.checked .status{color:var(--gold);opacity:0.7}
.checkin-btn{background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:#1a0a2e;border:none;border-radius:10px;padding:8px 18px;font-size:14px;font-weight:700;cursor:pointer;flex-shrink:0}
.checkin-btn:active{transform:scale(0.92)}
.done-badge{color:var(--gold);font-size:13px;font-weight:600;flex-shrink:0}
.empty-state{text-align:center;padding:60px 20px;color:#555;font-size:14px}
.success-overlay{position:fixed;inset:0;background:rgba(13,13,26,0.95);backdrop-filter:blur(10px);display:none;align-items:center;justify-content:center;flex-direction:column;gap:20px;z-index:200}
.success-overlay.show{display:flex;animation:fadeIn 0.3s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.success-star{width:100px;height:100px;background:linear-gradient(135deg,var(--gold),var(--gold-dark));clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);box-shadow:0 0 60px rgba(255,215,0,0.5);animation:pop 0.6s cubic-bezier(0.34,1.56,0.64,1)}
.success-text{font-size:24px;font-weight:700;color:var(--gold)}
.success-sub{font-size:14px;color:var(--text-dim)}
@keyframes pop{0%{transform:scale(0) rotate(-180deg)}60%{transform:scale(1.3) rotate(0deg)}100%{transform:scale(1) rotate(0deg)}}
.confirm-overlay{position:fixed;inset:0;background:rgba(13,13,26,0.85);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:300}
.confirm-overlay.show{display:flex;animation:fadeIn 0.25s ease}
.confirm-box{background:linear-gradient(160deg,rgba(30,30,50,0.95),rgba(20,20,35,0.95));border:1px solid rgba(255,215,0,0.25);border-radius:20px;padding:28px 24px;width:88%;max-width:340px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.5),0 0 40px rgba(255,215,0,0.1)}
.confirm-avatar{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;color:#fff;margin:0 auto 14px;box-shadow:0 0 24px rgba(255,215,0,0.3)}
.confirm-title{font-size:18px;font-weight:600;color:var(--text);margin-bottom:6px}
.confirm-desc{font-size:13px;color:var(--text-dim);margin-bottom:22px;line-height:1.6}
.confirm-btns{display:flex;gap:12px}
.confirm-btn{flex:1;padding:13px 0;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;transition:all 0.2s}
.confirm-btn:active{transform:scale(0.95)}
.btn-cancel{background:rgba(255,255,255,0.08);color:var(--text-dim);border:1px solid var(--border)}
.btn-ok{background:linear-gradient(135deg,var(--gold),var(--gold-dark));color:#1a0a2e}
.signed-overlay{position:fixed;inset:0;background:var(--bg-dark);background-image:radial-gradient(ellipse at top,rgba(255,215,0,0.08) 0%,transparent 50%),radial-gradient(ellipse at bottom,rgba(255,165,0,0.05) 0%,transparent 50%);display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:150;text-align:center;padding:0 30px}
.signed-overlay.show{display:flex;animation:fadeIn 0.3s ease}
.signed-star{width:90px;height:90px;background:linear-gradient(135deg,var(--gold),var(--gold-dark));clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);box-shadow:0 0 50px rgba(255,215,0,0.5);animation:float 3s ease-in-out infinite}
.signed-title{font-size:24px;font-weight:700;color:var(--gold);margin-top:8px}
.signed-name{font-size:18px;color:var(--text);font-weight:600}
.signed-sub{font-size:13px;color:var(--text-dim);line-height:1.7;margin-top:4px}
.brand-bar{width:100%;max-width:420px;padding:14px 0 0;display:flex;align-items:center;justify-content:flex-start}
.xbot-logo{display:flex;align-items:center;gap:8px;text-decoration:none}
.xbot-icon{width:30px;height:30px;flex-shrink:0}
.xbot-icon svg{width:100%;height:100%;display:block}
.xbot-text{display:flex;flex-direction:column;align-items:flex-start;line-height:1.05}
.xbot-en{font-size:15px;font-weight:800;letter-spacing:0.5px;background:linear-gradient(90deg,var(--gold),var(--gold-dark));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.xbot-cn{font-size:10px;color:var(--text-dim);letter-spacing:0.5px;margin-top:2px}
</style>
</head>
<body>
<div class="brand-bar">
<a class="xbot-logo" href="/">
<div class="xbot-icon">
<svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="xbotGold" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
<stop stop-color="#FFD700"/>
<stop offset="1" stop-color="#FFA500"/>
</linearGradient>
</defs>
<path d="M0 0 L20 0 L0 20 Z" fill="url(#xbotGold)"/>
<path d="M40 0 L40 20 L20 0 Z" fill="url(#xbotGold)"/>
<path d="M0 40 L0 20 L20 40 Z" fill="url(#xbotGold)"/>
<path d="M40 40 L20 40 L40 20 Z" fill="url(#xbotGold)"/>
<polygon points="20,13 27,20 20,27 13,20" fill="#444"/>
</svg>
</div>
<div class="xbot-text">
<div class="xbot-en">BOTPARK</div>
<div class="xbot-cn">北京基地</div>
</div>
</a>
</div>
<div class="header">
<div class="star-icon"></div>
<h1>扫码签到</h1>
<p>找到你的名字，点击签到</p>
</div>
<div class="search-wrap">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
<input class="search-input" id="search" type="text" placeholder="搜索你的名字..." autocomplete="off">
</div>
<div class="stats-bar">
<span>共 <span class="count" id="total">0</span> 人</span>
<span>已签到 <span class="count" id="checked">0</span> 人</span>
</div>
<div class="member-list" id="list"></div>
<div class="signed-overlay" id="signedOverlay">
<div class="signed-star"></div>
<div class="signed-title">你已完成签到</div>
<div class="signed-name" id="signedName"></div>
<div class="signed-sub">本轮每人仅可签到一次<br>如需重新签到，请联系现场管理员在大屏端重置</div>
</div>
<div class="confirm-overlay" id="confirmOverlay">
<div class="confirm-box">
<div class="confirm-avatar" id="confirmAvatar"></div>
<div class="confirm-title" id="confirmName"></div>
<div class="confirm-desc">确认要签到吗？<br>签到后大屏上的星星将为你点亮</div>
<div class="confirm-btns">
<button class="confirm-btn btn-cancel" onclick="hideConfirm()">取消</button>
<button class="confirm-btn btn-ok" onclick="doCheckin()">确认签到</button>
</div>
</div>
</div>
<div class="success-overlay" id="overlay">
<div class="success-star"></div>
<div class="success-text" id="success-name">签到成功!</div>
<div class="success-sub">大屏上的星星已为你点亮</div>
</div>
<script>
var members=[];
var currentBatchId=null;
function getLocal(){try{return JSON.parse(localStorage.getItem("starCheckin")||"{}")}catch(e){return{}}}
function setLocal(o){try{localStorage.setItem("starCheckin",JSON.stringify(o))}catch(e){}}
function isLocked(){var l=getLocal();return !!(l.batchId&&currentBatchId&&l.batchId===currentBatchId&&l.signedName)}
function applyLock(){
if(isLocked()){
document.getElementById("signedName").textContent=getLocal().signedName;
document.getElementById("signedOverlay").classList.add("show");
}else{
document.getElementById("signedOverlay").classList.remove("show");
var l=getLocal();
if(l.batchId&&currentBatchId&&l.batchId!==currentBatchId){setLocal({})}
}
}
function init(){
fetchMembers();
setInterval(fetchMembers,3000);
document.getElementById("search").addEventListener("input",renderList);
}
async function fetchMembers(){
try{
var res=await fetch("/api/members");
var data=await res.json();
if(data.success){
members=data.members;
currentBatchId=data.batchId||"1";
applyLock();
if(!isLocked())renderList();
}
}catch(err){console.error(err)}
}
function renderList(){
var list=document.getElementById("list");
var keyword=document.getElementById("search").value.trim().toLowerCase();
var filtered=keyword?members.filter(function(m){return m.name.toLowerCase().includes(keyword)}):members;
list.innerHTML="";
if(filtered.length===0){list.innerHTML='<div class="empty-state">没有找到匹配的成员</div>';return}
filtered.forEach(function(m){
var card=document.createElement("div");
card.className="member-card"+(m.checked?" checked":"");
card.id="card-"+m.id;
card.innerHTML='<div class="avatar-circle" style="background:'+m.color+'">'+m.name.charAt(0)+'</div><div class="member-info"><div class="name">'+m.name+'</div><div class="status">'+(m.checked?"已签到":"未签到")+'</div></div>'+(m.checked?'<div class="done-badge">已签到</div>':'<button class="checkin-btn" onclick="checkin('+m.id+')">签到</button>');
list.appendChild(card);
});
document.getElementById("total").textContent=members.length;
document.getElementById("checked").textContent=members.filter(function(m){return m.checked}).length;
}
var pendingId=null;
function checkin(id){
var member=members.find(function(m){return m.id===id});
if(!member||member.checked)return;
pendingId=id;
document.getElementById("confirmAvatar").textContent=member.name.charAt(0);
document.getElementById("confirmAvatar").style.background=member.color;
document.getElementById("confirmName").textContent=member.name;
document.getElementById("confirmOverlay").classList.add("show");
}
function hideConfirm(){
document.getElementById("confirmOverlay").classList.remove("show");
pendingId=null;
}
async function doCheckin(){
if(pendingId===null)return;
var id=pendingId;
var member=members.find(function(m){return m.id===id});
if(!member||member.checked){hideConfirm();return}
hideConfirm();
try{
var res=await fetch("/api/checkin",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:id})});
var data=await res.json();
if(data.success){
setLocal({batchId:data.batchId||currentBatchId,signedName:member.name});
var overlay=document.getElementById("overlay");
document.getElementById("success-name").textContent=member.name+" 签到成功!";
overlay.classList.add("show");
setTimeout(function(){overlay.classList.remove("show");applyLock()},2500);
fetchMembers();
}else{alert(data.message||"签到失败")}
}catch(err){alert("网络错误，请重试")}
}
init();
</script>
</body>
</html>
